
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: chatbot-postgres
    environment:
      POSTGRES_DB: satu_data_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: qwert12345!
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./api/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chatbot-network
    restart: unless-stopped
    profiles:
      - with-postgres

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: chatbot-api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:qwert12345!@postgres:5432/satu_data_db}
      QWEN_API_URL: ${QWEN_API_URL:-http://host.docker.internal:9002/v1/chat/completions}
      QWEN_MODEL: huggingface.co/quantfactory/qwen2.5-7b-instruct-uncensored-gguf:Q4_K_M
      API_HOST: 0.0.0.0
      API_PORT: 8765
      CORS_ORIGINS: '["*"]'
      FORCE_HTTPS: false
      TRUST_PROXY_HEADERS: true
      LOG_LEVEL: INFO
      MAINTENANCE_MODE: ${MAINTENANCE_MODE:-false}
      MAINTENANCE_MESSAGE: ${MAINTENANCE_MESSAGE:-Sistem sedang dalam pemeliharaan}
      SWAGGER_AUTH_USERNAME: ${SWAGGER_AUTH_USERNAME:-}
      SWAGGER_AUTH_PASSWORD: ${SWAGGER_AUTH_PASSWORD:-}
      SWAGGER_AUTH_REALM: ${SWAGGER_AUTH_REALM:-Swagger}
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY:-changeme-admin-secret}
      UPLOAD_DIR: ${UPLOAD_DIR:-uploads/kemhan}
    ports:
      - "8765:8765"
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    volumes:
      - ./api/logs:/app/logs
      - ./api/uploads:/app/uploads
      - huggingface_cache:/root/.cache/huggingface
    networks:
      - chatbot-network
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: https://apps.syscloud.my.id/chatbot-api
    container_name: chatbot-frontend
    ports:
      - "8766:80"
    depends_on:
      - api
    networks:
      - chatbot-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  huggingface_cache:
    driver: local

networks:
  chatbot-network:
    driver: bridge
